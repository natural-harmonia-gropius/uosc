name: Update Material Symbols font

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write

concurrency:
  group: update-material-symbols-font
  cancel-in-progress: false

jobs:
  update-font:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: latest

      - name: Download and validate the latest font
        run: node .github/workflows/update-material-symbols-font/script.js

      - name: Stage and check changes
        id: changes
        shell: bash
        run: |
          git add -- src/fonts/uosc_icons.ttf

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push changes
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Material Symbols Rounded font"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
